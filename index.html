<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSM - Manager Control Panel</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        mcd: { dark: '#1F2937', gold: '#FFC107', goldhover: '#E0A800', light: '#F3F4F6' }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F3F4F6; overflow: hidden; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .dot-online { background-color: #10B981; }
        .dot-break { background-color: #F59E0B; }
        .dot-offline { background-color: #9CA3AF; }
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 12px 20px; border-radius: 8px; color: white; font-weight: 500; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 10px; }
        .toast.success { background-color: #10B981; }
        .toast.error { background-color: #EF4444; }
        .toast.warning { background-color: #F59E0B; }
    </style>
</head>
<body class="h-screen w-screen flex">

    <div id="toast-container"></div>

    <!-- APP SHELL (Directly Visible) -->
    <div id="app-shell" class="w-full h-full flex">
        <nav class="w-64 bg-mcd-dark text-white flex flex-col shadow-2xl z-10">
            <div class="h-20 flex items-center px-6 border-b border-gray-700">
                <i class="fa-solid fa-burger text-2xl text-mcd-gold mr-3"></i>
                <h1 class="text-xl font-bold tracking-wider">CSM<span class="text-mcd-gold">Manager</span></h1>
            </div>
            
            <div class="flex-1 py-6 px-4 space-y-2">
                <button onclick="navigate('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center px-4 py-3 rounded-lg bg-gray-800 text-mcd-gold">
                    <i class="fa-solid fa-chart-pie w-6"></i><span class="font-medium">Tableau de Bord</span>
                </button>
                <button onclick="navigate('staff')" id="nav-staff" class="nav-btn w-full flex items-center px-4 py-3 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white">
                    <i class="fa-solid fa-users w-6"></i><span class="font-medium">Employés</span>
                </button>
            </div>

            <div class="p-4 border-t border-gray-700">
                <div class="text-xs text-gray-400 mb-2">Resto: <b class="text-white">KETIA</b></div>
            </div>
        </nav>

        <main class="flex-1 bg-mcd-light overflow-y-auto h-full flex flex-col">
            <!-- Dashboard View -->
            <div id="view-dashboard" class="view-section active p-8">
                <div class="mb-8 flex justify-between items-end">
                    <div>
                        <h2 class="text-3xl font-bold text-gray-800">Pointage en Direct</h2>
                        <p class="text-gray-500 mt-1">Surveillez l'état de l'équipe.</p>
                    </div>
                    <div class="bg-white px-4 py-2 rounded-lg shadow-sm border border-gray-200 flex items-center text-sm font-medium text-gray-600">
                        <i class="fa-regular fa-clock mr-2 text-mcd-gold"></i><span id="live-clock">--:--:--</span>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-100 bg-gray-50 font-bold text-gray-700">Contrôle des Services</div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="text-gray-400 text-xs uppercase tracking-wider bg-white border-b border-gray-100">
                                    <th class="px-6 py-4">Employé</th>
                                    <th class="px-6 py-4">Badge</th>
                                    <th class="px-6 py-4">Statut</th>
                                    <th class="px-6 py-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="dashboard-tbody" class="divide-y divide-gray-100 text-sm"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Staff View -->
            <div id="view-staff" class="view-section p-8">
                <div class="flex justify-between items-end mb-8">
                    <h2 class="text-3xl font-bold text-gray-800">Gestion des Employés</h2>
                    <button onclick="openStaffModal()" class="bg-mcd-gold text-mcd-dark font-semibold py-2 px-4 rounded-lg">Ajouter Employé</button>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="text-gray-400 text-xs uppercase tracking-wider bg-gray-50 border-b border-gray-100">
                                <th class="px-6 py-4">Badge</th>
                                <th class="px-6 py-4">Nom Complet</th>
                                <th class="px-6 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="staff-tbody" class="divide-y divide-gray-100 text-sm"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="staff-modal" class="fixed inset-0 bg-gray-900/50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6">
            <h3 class="font-bold text-gray-800 mb-4">Ajouter un Employé</h3>
            <form id="staff-form" class="space-y-4">
                <div><label class="block text-sm">Badge</label><input type="text" id="staff-badge" required class="w-full px-4 py-2 border rounded-lg"></div>
                <div><label class="block text-sm">Nom</label><input type="text" id="staff-name" required class="w-full px-4 py-2 border rounded-lg"></div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeStaffModal()" class="px-4 py-2 border rounded-lg">Annuler</button>
                    <button type="submit" class="px-4 py-2 bg-mcd-dark text-white rounded-lg">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQHH4QgqgYNu3tnGDP55Pne0neQskUvqE",
            authDomain: "contractsocialmanager-v1.firebaseapp.com",
            projectId: "contractsocialmanager-v1",
            storageBucket: "contractsocialmanager-v1.firebasestorage.app",
            messagingSenderId: "990515772482",
            appId: "1:887068908069:web:d5a039e90add6c2c45fdcc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const RESTAURANT_ID = 'ketia';
        let staffList = [];
        let activeShifts = {};

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        window.navigate = function(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => { el.classList.remove('bg-gray-800', 'text-mcd-gold'); el.classList.add('text-gray-400'); });
            document.getElementById(`view-${viewId}`).classList.add('active');
            const btn = document.getElementById(`nav-${viewId}`);
            if (btn) { btn.classList.remove('text-gray-400'); btn.classList.add('bg-gray-800', 'text-mcd-gold'); }
        };

        // Initialize App Directly on Load
        window.addEventListener('DOMContentLoaded', () => {
            startListeners();
            setInterval(() => document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('fr-FR'), 1000);
        });

        function startListeners() {
            onSnapshot(collection(db, 'restaurants', RESTAURANT_ID, 'staff'), snap => {
                staffList = [];
                snap.forEach(d => staffList.push({ id: d.id, ...d.data() }));
                renderStaff();
                renderDashboard();
            });

            const today = new Date().toISOString().split('T')[0];
            onSnapshot(query(collection(db, 'restaurants', RESTAURANT_ID, 'shifts'), where('date', '==', today)), snap => {
                activeShifts = {};
                snap.forEach(d => {
                    const s = d.data();
                    if (!s.endTime) activeShifts[s.badge] = { id: d.id, ...s };
                });
                renderDashboard();
            });
        }

        function renderDashboard() {
            const tbody = document.getElementById('dashboard-tbody');
            tbody.innerHTML = staffList.length ? '' : '<tr><td colspan="4" class="p-6 text-center text-gray-500">Aucun employé. Allez dans l\'onglet Employés pour en ajouter.</td></tr>';
            staffList.forEach(staff => {
                const shift = activeShifts[staff.id];
                const tr = document.createElement('tr');
                let status = '<span class="status-dot dot-offline"></span> Repos';
                let acts = `<button onclick="actionStart('${staff.id}', '${staff.name}')" class="bg-mcd-dark text-white px-3 py-1 rounded text-xs">Démarrer</button>`;
                if (shift) {
                    status = '<span class="status-dot dot-online"></span> En Service';
                    acts = `<button onclick="actionEnd('${shift.id}')" class="bg-red-50 text-red-600 px-3 py-1 rounded text-xs">Terminer</button>`;
                }
                tr.innerHTML = `<td class="px-6 py-4 font-medium">${staff.name}</td><td class="px-6 py-4 text-gray-500">#${staff.id}</td><td class="px-6 py-4">${status}</td><td class="px-6 py-4 text-right">${acts}</td>`;
                tbody.appendChild(tr);
            });
        }

        function renderStaff() {
            const tbody = document.getElementById('staff-tbody');
            tbody.innerHTML = '';
            staffList.forEach(staff => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="px-6 py-4">#${staff.id}</td><td class="px-6 py-4 font-medium">${staff.name}</td><td class="px-6 py-4 text-right"><button onclick="deleteStaff('${staff.id}')" class="text-red-500"><i class="fa-solid fa-trash"></i></button></td>`;
                tbody.appendChild(tr);
            });
        }

        window.actionStart = async (badge, name) => {
            const now = new Date();
            await addDoc(collection(db, 'restaurants', RESTAURANT_ID, 'shifts'), { badge, name, date: now.toISOString().split('T')[0], startTime: now.toISOString(), endTime: null, breakStart: null, breakEnd: null });
            showToast("Service démarré");
        };
        window.actionEnd = async (id) => {
            await updateDoc(doc(db, 'restaurants', RESTAURANT_ID, 'shifts', id), { endTime: new Date().toISOString() });
            showToast("Service terminé");
        };

        window.openStaffModal = () => document.getElementById('staff-modal').classList.remove('hidden');
        window.closeStaffModal = () => document.getElementById('staff-modal').classList.add('hidden');
        document.getElementById('staff-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const badge = document.getElementById('staff-badge').value.trim();
            const name = document.getElementById('staff-name').value.trim();
            await setDoc(doc(db, 'restaurants', RESTAURANT_ID, 'staff', badge), { name });
            showToast("Employé ajouté !");
            closeStaffModal();
        });
        window.deleteStaff = async (badge) => {
            if(confirm("Supprimer cet employé ?")) {
                await deleteDoc(doc(db, 'restaurants', RESTAURANT_ID, 'staff', badge));
                showToast("Employé supprimé");
            }
        };
    </script>
</body>
</html>
