<!DOCTYPE html>
<html lang="fr" class="theme-light">
<head>
  <meta charset="UTF-8">
  <title>Employés - CSM</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <link rel="stylesheet" href="../shared/enterprise.css">
  <style>
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
    .staff-card { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 1.5rem; }
    .avatar { width: 64px; height: 64px; background: var(--line); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; color: var(--text-muted); margin-bottom: 1rem; }
  </style>
</head>
<body class="enterprise">
  <header class="topbar">
    <div class="topbar-brand"><img src="../shared/200.webp" alt="Logo" onerror="this.style.display='none'"> CSM - Employés</div>
    <nav class="topbar-nav">
      <a href="index.html">Pointages</a>
      <a href="planning.html">Planning</a>
      <a href="staff.html" class="active">Employés</a>
      <a href="requests.html">Demandes</a>
      <a href="daily-import.html">Importer</a>
    </nav>
    <div class="flex items-center gap-4">
      <button id="btnTheme" class="iconbtn">🌙</button>
      <button id="btnLogout" class="btn btn-outline">Déconnexion</button>
    </div>
  </header>

  <main class="main-content">
    <div class="page-header">
      <div class="flex items-center gap-4">
        <input type="text" id="searchInput" placeholder="Rechercher (Nom ou Badge)..." style="width: 300px;">
        <select id="filterSelect" class="form-group" style="margin-bottom: 0;">
          <option value="active">Actifs</option>
          <option value="all">Tous</option>
          <option value="inactive">Désactivés</option>
        </select>
      </div>
      <button id="btnAddStaff" class="btn btn-primary">+ Ajouter un employé</button>
    </div>
    <div id="staffGrid" class="grid"></div>
  </main>

  <!-- Add/Edit Modal -->
  <div id="staffModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Ajouter un employé</h3>
        <button class="iconbtn close-modal">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Badge</label>
          <input type="text" id="staffBadge" required>
        </div>
        <div class="form-group">
          <label>Nom complet</label>
          <input type="text" id="staffName" required>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline close-modal">Annuler</button>
        <button id="btnSaveStaff" class="btn btn-primary">Enregistrer</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="../shared/firebase.js"></script>
  <script>
    const themeBtn = document.getElementById('btnTheme');
    let isDark = localStorage.getItem('csct_manager_theme') === 'dark';
    const applyTheme = () => { document.documentElement.className = isDark ? 'theme-dark' : 'theme-light'; themeBtn.innerText = isDark ? '☀️' : '🌙'; localStorage.setItem('csct_manager_theme', isDark ? 'dark' : 'light'); };
    applyTheme(); themeBtn.onclick = () => { isDark = !isDark; applyTheme(); };

    CSM.authReady.then(u => { if(!u) window.location.href='login.html'; });
    document.getElementById('btnLogout').onclick = () => window.auth.signOut().then(() => window.location.href='login.html');

    let staffList = [];
    const grid = document.getElementById('staffGrid');

    CSM.ready.then(() => {
      CSM.refs.staffColl().onSnapshot(snap => {
        staffList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        staffList.sort((a, b) => a.name.localeCompare(b.name, 'fr'));
        renderGrid();
      });
    });

    document.getElementById('searchInput').oninput = renderGrid;
    document.getElementById('filterSelect').onchange = renderGrid;

    function renderGrid() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const filter = document.getElementById('filterSelect').value;
      
      grid.innerHTML = '';
      staffList.forEach(s => {
        if (filter === 'active' && s.active === false) return;
        if (filter === 'inactive' && s.active !== false) return;
        if (term && !s.name.toLowerCase().includes(term) && !s.badge.includes(term)) return;

        const card = document.createElement('div');
        card.className = 'card staff-card';
        card.style.opacity = s.active === false ? '0.6' : '1';
        
        card.innerHTML = `
          <div class="avatar">${s.name.charAt(0).toUpperCase()}</div>
          <h4>${s.name}</h4>
          <p class="text-muted mb-4">Badge: ${s.badge}</p>
          <div class="flex gap-2">
            <button class="btn btn-outline" onclick="openEdit('${s.badge}', '${s.name.replace(/'/g, "\\'")}')">Modifier</button>
            <button class="btn ${s.active === false ? 'btn-success' : 'btn-danger-outline'}" 
                    onclick="toggleStatus('${s.id}', ${s.active !== false})">
              ${s.active === false ? 'Réactiver' : 'Désactiver'}
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    const modal = document.getElementById('staffModal');
    let editingBadge = null;

    document.getElementById('btnAddStaff').onclick = () => {
      editingBadge = null;
      document.getElementById('modalTitle').innerText = 'Ajouter un employé';
      document.getElementById('staffBadge').value = '';
      document.getElementById('staffBadge').disabled = false;
      document.getElementById('staffName').value = '';
      modal.classList.add('active');
    };

    window.openEdit = (badge, name) => {
      editingBadge = badge;
      document.getElementById('modalTitle').innerText = 'Modifier l\'employé';
      document.getElementById('staffBadge').value = badge;
      document.getElementById('staffBadge').disabled = true;
      document.getElementById('staffName').value = name;
      modal.classList.add('active');
    };

    window.toggleStatus = async (badge, currentActive) => {
      if(confirm(`Voulez-vous ${currentActive ? 'désactiver' : 'réactiver'} cet employé ?`)) {
        await CSM.refs.staff(badge).update({ active: !currentActive, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      }
    };

    document.querySelectorAll('.close-modal').forEach(b => b.onclick = () => modal.classList.remove('active'));

    document.getElementById('btnSaveStaff').onclick = async () => {
      const badge = document.getElementById('staffBadge').value.trim();
      const name = document.getElementById('staffName').value.trim();
      if (!badge || !name) return alert("Remplissez tous les champs.");

      const payload = { badge, name, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
      if (!editingBadge) payload.createdAt = payload.updatedAt;
      payload.active = true;

      await CSM.refs.staff(badge).set(payload, { merge: true });
      modal.classList.remove('active');
    };
  </script>
</body>
</html>
