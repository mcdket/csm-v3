<!DOCTYPE html>
<html lang="fr" class="theme-light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - CSM</title>
  <link rel="icon" href="../shared/200.webp" type="image/webp">
  <link rel="stylesheet" href="../shared/styles.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; height: 100vh; background-color: var(--bg); }
    .login-card { width: 100%; max-width: 400px; padding: 2rem; text-align: center; }
    .login-card img { width: 80px; height: 80px; margin-bottom: 1rem; border-radius: 50%; }
    .error-msg { color: var(--status-crit-fg); background: var(--status-crit-bg); padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; display: none; font-size: 0.875rem; }
  </style>
</head>
<body>
  <div class="card login-card">
    <img src="../shared/200.webp" alt="Logo" onerror="this.style.display='none'">
    <h2>Espace Manager</h2>
    <p class="mb-4 text-muted" id="restaurantName">Chargement...</p>
    
    <div id="errorBox" class="error-msg"></div>

    <form id="loginForm" class="text-left">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="manager@restaurant.com">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" id="btnSubmit">Se connecter</button>
    </form>
    <div class="mt-4">
      <a id="btnReset" style="font-size: 0.875rem;">Mot de passe oublié ?</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="../shared/firebase.js"></script>
  <script>
    document.getElementById('restaurantName').innerText = `Restaurant: ${CSM.restaurantName}`;
    const errorBox = document.getElementById('errorBox');

    function showError(msg) {
      errorBox.innerText = msg;
      errorBox.style.display = 'block';
    }

    CSM.authReady.then(user => {
      if (user) {
        CSM.ready.then(isManager => {
          if (isManager) window.location.href = 'index.html';
        });
      }
    });

    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = 'Connexion...';
      errorBox.style.display = 'none';

      try {
        const cred = await window.auth.signInWithEmailAndPassword(
          document.getElementById('email').value, 
          document.getElementById('password').value
        );
        const doc = await CSM.refs.managers(cred.user.uid).get();
        if (!doc.exists || doc.data().restaurantId !== CSM.restaurantId) {
          await window.auth.signOut();
          showError("Accès refusé. Vous n'êtes pas assigné à ce restaurant.");
        } else {
          window.location.href = 'index.html';
        }
      } catch (err) {
        if (err.code === 'auth/invalid-credential') showError("Email ou mot de passe incorrect.");
        else if (err.code === 'auth/too-many-requests') showError("Trop de tentatives. Réessayez plus tard.");
        else showError("Erreur de connexion : " + err.message);
      }
      btn.disabled = false;
      btn.innerText = 'Se connecter';
    };

    document.getElementById('btnReset').onclick = async () => {
      const email = document.getElementById('email').value;
      if (!email) return showError("Veuillez entrer votre email d'abord.");
      try {
        await window.auth.sendPasswordResetEmail(email);
        alert("Lien de réinitialisation envoyé à " + email);
      } catch(err) {
        showError("Erreur d'envoi. Vérifiez l'email.");
      }
    };
  </script>
</body>
</html>
